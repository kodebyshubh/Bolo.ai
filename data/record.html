  audio { width:100%; margin: 12px 0; }

<div id="keys">Space = start/stop recording, Enter = save &amp; next, Backspace = redo current line, / = skip line</div>
<div id="done" style="display:none">All done! Move the downloaded files into data/audio/selfrecorded/.</div>

0.wav", "text": "Naye saal ka resolution kya banaya tumne?"}, {"filename": "selfrecorded_091.wav", "text": "Theek hai, ab main chalta hoon."}, {"filename": "selfrecorded_092.wav", "text": "Sab kuch samajh aa gaya, thank you."}, {"filename": "selfrecorded_093.wav", "text": "Phir milte hain, take care bhai."}, {"filename": "selfrecorded_094.wav", "text": "Yeh conversation yahin khatam karte hain."}, {"filename": "selfrecorded_095.wav", "text": "Koi aur sawaal ho toh batana."}, {"filename": "selfrecorded_096.wav", "text": "Bahut accha laga baat karke."}, {"filename": "selfrecorded_097.wav", "text": "Chalo ab kaam par wapas jaate hain."}, {"filename": "selfrecorded_098.wav", "text": "Aaj ke liye itna hi, good night."}, {"filename": "selfrecorded_099.wav", "text": "Agli baar aur detail mein baat karenge."}, {"filename": "selfrecorded_100.wav", "text": "Dhanyavaad, apna dhyan rakhna."}];
let idx = 0;
let stream, mediaRecorder, chunks = [];
let currentWavBlob = null;
let isRecording = false;

const el = {
  progress: document.getElementById('progress'),
  filename: document.getElementById('filename'),
  sentence: document.getElementById('sentence'),
  status: document.getElementById('status'),
  player: document.getElementById('player'),
  recordBtn: document.getElementById('recordBtn'),
  saveBtn: document.getElementById('saveBtn'),
  redoBtn: document.getElementById('redoBtn'),
  skipBtn: document.getElementById('skipBtn'),
  done: document.getElementById('done'),
};

function render() {
  if (idx >= sentences.length) {
    ['progress','filename','sentence','status','player','recordBtn','saveBtn','redoBtn','skipBtn'].forEach(function(k) { el[k].style.display = 'none'; });
    el.done.style.display = 'block';
    return;
  }
  const item = sentences[idx];
  el.progress.textContent = (idx + 1) + ' / ' + sentences.length;
  el.filename.textContent = item.filename;
  el.sentence.textContent = item.text;
  el.status.textContent = '';
  el.player.src = '';
  currentWavBlob = null;
  el.saveBtn.disabled = true;
  el.redoBtn.disabled = true;
  el.recordBtn.textContent = 'Record (Space)';
  el.recordBtn.classList.remove('recording');
}

function encodeWAV(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  function writeString(offset, s) { for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i)); }
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}

function mixToMono(buf) {
  if (buf.numberOfChannels === 1) return buf.getChannelData(0);
  const ch0 = buf.getChannelData(0), ch1 = buf.getChannelData(1);
  const out = new Float32Array(ch0.length);
  for (let i = 0; i < ch0.length; i++) out[i] = (ch0[i] + ch1[i]) / 2;
  return out;
}

async function startRecording() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = function(e) { chunks.push(e.data); };
  mediaRecorder.start();
  isRecording = true;
  el.recordBtn.textContent = 'Stop (Space)';
  el.recordBtn.classList.add('recording');
  el.status.textContent = 'recording...';
  el.saveBtn.disabled = true;
  el.redoBtn.disabled = true;
}

function stopRecording() {
  return new Promise(function(resolve) {
    mediaRecorder.onstop = async function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      const webmBlob = new Blob(chunks, { type: 'audio/webm' });
      const arrayBuf = await webmBlob.arrayBuffer();
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
      const mono = mixToMono(audioBuf);
      currentWavBlob = encodeWAV(mono, audioBuf.sampleRate);
      el.player.src = URL.createObjectURL(currentWavBlob);
      el.status.textContent = 'captured ' + (mono.length / audioBuf.sampleRate).toFixed(1) + 's -- listen, then Save or Redo';
      el.saveBtn.disabled = false;
      el.redoBtn.disabled = false;
      isRecording = false;
      el.recordBtn.textContent = 'Record (Space)';
      el.recordBtn.classList.remove('recording');
      resolve();
    };
    mediaRecorder.stop();
  });
}

function saveAndNext() {
  if (!currentWavBlob) return;
  const item = sentences[idx];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(currentWavBlob);
  a.download = item.filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  idx++;
  render();
}

function redo() {
  el.player.src = '';
  el.status.textContent = 'discarded -- record again';
  currentWavBlob = null;
  el.saveBtn.disabled = true;
  el.redoBtn.disabled = true;
}

el.recordBtn.onclick = function() { isRecording ? stopRecording() : startRecording(); };
el.saveBtn.onclick = saveAndNext;
el.redoBtn.onclick = redo;
el.skipBtn.onclick = function() { idx++; render(); };

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') { e.preventDefault(); isRecording ? stopRecording() : startRecording(); }
  if (e.code === 'Enter') { e.preventDefault(); saveAndNext(); }
  if (e.code === 'Backspace') { e.preventDefault(); redo(); }
  if (e.code === 'Slash') { e.preventDefault(); idx++; render(); }
});

render();
</script>
